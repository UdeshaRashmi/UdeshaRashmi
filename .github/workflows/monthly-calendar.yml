name: Monthly Contribution Calendar

on:
  workflow_dispatch:

  schedule:
    # Runs every day at 00:15 UTC
    - cron: "15 0 * * *"

# Deny permissions by default.
permissions: {}

concurrency:
  group: monthly-contribution-calendar
  cancel-in-progress: true

jobs:
  generate:
    name: Generate contribution calendar

    runs-on: ubuntu-latest

    timeout-minutes: 10

    # Only this job needs permission to update the profile repository.
    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Generate monthly contribution calendar
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ github.repository_owner }}

        run: |
          set -euo pipefail

          python3 <<'PY'
          import calendar
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path


          # ============================================================
          # CONFIGURATION
          # ============================================================

          USERNAME = os.environ["GITHUB_USER"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          MONTHS_TO_SHOW = 12

          ROOT = Path(".")
          ACTIVITY_DIR = ROOT / "activity"
          ASSETS_DIR = ACTIVITY_DIR / "assets"

          ACTIVITY_DIR.mkdir(parents=True, exist_ok=True)
          ASSETS_DIR.mkdir(parents=True, exist_ok=True)


          # ============================================================
          # DATE HELPERS
          # ============================================================

          def add_months(d, amount):
              month_index = (
                  d.year * 12
                  + (d.month - 1)
                  + amount
              )

              year = month_index // 12
              month = month_index % 12 + 1

              return date(year, month, 1)


          current_month = (
              datetime.now(timezone.utc)
              .date()
              .replace(day=1)
          )

          months = [
              add_months(current_month, offset)
              for offset in range(
                  -(MONTHS_TO_SHOW - 1),
                  1
              )
          ]


          # ============================================================
          # GITHUB GRAPHQL QUERY
          # ============================================================
          #
          # PRIVACY:
          #
          # We intentionally request ONLY:
          #
          # - contribution date
          # - anonymous contribution count
          # - total contribution count
          # - whether restricted/private contributions exist
          #
          # We DO NOT request:
          #
          # - private repository names
          # - repository URLs
          # - source code
          # - files
          # - branches
          # - commit messages
          # - private issue details
          # - private pull request details
          #
          # ============================================================

          QUERY = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              contributionsCollection(
                from: $from,
                to: $to
              ) {
                hasAnyRestrictedContributions

                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """


          def fetch_month(month_start):
              next_month = add_months(
                  month_start,
                  1
              )

              month_end = (
                  next_month
                  - timedelta(days=1)
              )

              variables = {
                  "login": USERNAME,
                  "from": (
                      f"{month_start.isoformat()}"
                      "T00:00:00Z"
                  ),
                  "to": (
                      f"{month_end.isoformat()}"
                      "T23:59:59Z"
                  ),
              }

              payload = {
                  "query": QUERY,
                  "variables": variables,
              }

              request_body = json.dumps(
                  payload
              ).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=request_body,
                  headers={
                      "Authorization": (
                          f"Bearer {TOKEN}"
                      ),
                      "Accept": (
                          "application/vnd.github+json"
                      ),
                      "Content-Type": (
                          "application/json"
                      ),
                      "User-Agent": (
                          "monthly-contribution-calendar"
                      ),
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30,
                  ) as response:
                      result = json.load(response)

              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      "GitHub GraphQL request failed "
                      f"with HTTP status {error.code}."
                  ) from error

              except urllib.error.URLError as error:
                  raise RuntimeError(
                      "Unable to connect to "
                      "GitHub GraphQL API."
                  ) from error


              if result.get("errors"):
                  # Do not dump full API response.
                  # Only print safe error messages.

                  messages = [
                      str(
                          error.get(
                              "message",
                              "Unknown GraphQL error"
                          )
                      )
                      for error
                      in result["errors"]
                  ]

                  raise RuntimeError(
                      "GitHub GraphQL error: "
                      + " | ".join(messages)
                  )


              user = (
                  result
                  .get("data", {})
                  .get("user")
              )

              if user is None:
                  raise RuntimeError(
                      "GitHub user was not found."
                  )


              collection = user[
                  "contributionsCollection"
              ]

              calendar_data = collection[
                  "contributionCalendar"
              ]

              counts = {}


              for week in calendar_data["weeks"]:

                  for day_data in week[
                      "contributionDays"
                  ]:

                      day_date = (
                          date.fromisoformat(
                              day_data["date"]
                          )
                      )

                      if (
                          day_date.year
                          == month_start.year
                          and
                          day_date.month
                          == month_start.month
                      ):
                          counts[day_date] = int(
                              day_data[
                                  "contributionCount"
                              ]
                          )


              total = int(
                  calendar_data[
                      "totalContributions"
                  ]
              )

              has_private_activity = bool(
                  collection[
                      "hasAnyRestrictedContributions"
                  ]
              )


              return (
                  counts,
                  total,
                  has_private_activity,
              )


          # ============================================================
          # COLOR SYSTEM
          # ============================================================

          def contribution_color(
              count,
              maximum,
          ):
              if count <= 0:
                  return "#161B22"

              if maximum <= 0:
                  return "#312E81"

              ratio = count / maximum

              if ratio <= 0.20:
                  return "#312E81"

              if ratio <= 0.40:
                  return "#4F46E5"

              if ratio <= 0.60:
                  return "#7C3AED"

              if ratio <= 0.80:
                  return "#A855F7"

              return "#EC4899"


          # ============================================================
          # SVG GENERATOR
          # ============================================================

          def generate_svg(
              month_start,
              counts,
              total,
          ):
              year = month_start.year
              month = month_start.month

              title = (
                  f"{calendar.month_name[month]} "
                  f"{year}"
              )

              month_calendar = calendar.Calendar(
                  firstweekday=6
              )

              weeks = (
                  month_calendar
                  .monthdatescalendar(
                      year,
                      month
                  )
              )


              WIDTH = 850
              HEIGHT = 565

              START_X = 65
              START_Y = 145

              CELL_W = 100
              CELL_H = 59

              GAP_X = 8
              GAP_Y = 8


              maximum = max(
                  counts.values(),
                  default=0
              )

              svg = []


              svg.append(
                  f'''<svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="{WIDTH}"
                    height="{HEIGHT}"
                    viewBox="0 0 {WIDTH} {HEIGHT}"
                    role="img"
                    aria-label="{title} GitHub contributions"
                  >'''
              )


              # Main background
              svg.append(
                  f'''
                  <rect
                    width="{WIDTH}"
                    height="{HEIGHT}"
                    rx="24"
                    fill="#0D1117"
                  />
                  '''
              )


              # Border
              svg.append(
                  f'''
                  <rect
                    x="1"
                    y="1"
                    width="{WIDTH - 2}"
                    height="{HEIGHT - 2}"
                    rx="23"
                    fill="none"
                    stroke="#30363D"
                  />
                  '''
              )


              # Month title
              svg.append(
                  f'''
                  <text
                    x="50"
                    y="55"
                    fill="#F0F6FC"
                    font-size="27"
                    font-weight="700"
                    font-family="Arial, sans-serif"
                  >
                    {title}
                  </text>
                  '''
              )


              # Total contributions
              svg.append(
                  f'''
                  <text
                    x="50"
                    y="88"
                    fill="#8B949E"
                    font-size="15"
                    font-family="Arial, sans-serif"
                  >
                    {total} contributions
                  </text>
                  '''
              )


              # --------------------------------------------------------
              # LEGEND
              # --------------------------------------------------------

              legend_colors = [
                  "#161B22",
                  "#312E81",
                  "#4F46E5",
                  "#7C3AED",
                  "#A855F7",
                  "#EC4899",
              ]

              legend_x = 565


              svg.append(
                  '''
                  <text
                    x="525"
                    y="84"
                    fill="#8B949E"
                    font-size="12"
                    font-family="Arial, sans-serif"
                  >
                    Less
                  </text>
                  '''
              )


              for index, color in enumerate(
                  legend_colors
              ):
                  x = (
                      legend_x
                      + index * 24
                  )

                  svg.append(
                      f'''
                      <rect
                        x="{x}"
                        y="71"
                        width="17"
                        height="17"
                        rx="4"
                        fill="{color}"
                      />
                      '''
                  )


              svg.append(
                  '''
                  <text
                    x="718"
                    y="84"
                    fill="#8B949E"
                    font-size="12"
                    font-family="Arial, sans-serif"
                  >
                    More
                  </text>
                  '''
              )


              # --------------------------------------------------------
              # WEEKDAY LABELS
              # --------------------------------------------------------

              weekdays = [
                  "SUN",
                  "MON",
                  "TUE",
                  "WED",
                  "THU",
                  "FRI",
                  "SAT",
              ]


              for column, weekday in enumerate(
                  weekdays
              ):
                  x = (
                      START_X
                      + column
                      * (CELL_W + GAP_X)
                      + CELL_W / 2
                  )

                  svg.append(
                      f'''
                      <text
                        x="{x}"
                        y="125"
                        text-anchor="middle"
                        fill="#8B949E"
                        font-size="12"
                        font-weight="600"
                        font-family="Arial, sans-serif"
                      >
                        {weekday}
                      </text>
                      '''
                  )


              # --------------------------------------------------------
              # CALENDAR DAYS
              # --------------------------------------------------------

              for row, week in enumerate(
                  weeks
              ):

                  for column, day in enumerate(
                      week
                  ):

                      x = (
                          START_X
                          + column
                          * (CELL_W + GAP_X)
                      )

                      y = (
                          START_Y
                          + row
                          * (CELL_H + GAP_Y)
                      )


                      # Outside current month
                      if day.month != month:

                          svg.append(
                              f'''
                              <rect
                                x="{x}"
                                y="{y}"
                                width="{CELL_W}"
                                height="{CELL_H}"
                                rx="9"
                                fill="#0D1117"
                                stroke="#161B22"
                              />
                              '''
                          )

                          continue


                      count = counts.get(
                          day,
                          0
                      )

                      color = (
                          contribution_color(
                              count,
                              maximum
                          )
                      )


                      tooltip = (
                          f"{day.strftime('%B %d, %Y')}"
                          f" — {count} contribution"
                          f"{'' if count == 1 else 's'}"
                      )


                      svg.append("<g>")


                      svg.append(
                          f"<title>{tooltip}</title>"
                      )


                      svg.append(
                          f'''
                          <rect
                            x="{x}"
                            y="{y}"
                            width="{CELL_W}"
                            height="{CELL_H}"
                            rx="9"
                            fill="{color}"
                            stroke="#30363D"
                            stroke-width="1"
                          />
                          '''
                      )


                      # Day number
                      svg.append(
                          f'''
                          <text
                            x="{x + 12}"
                            y="{y + 23}"
                            fill="#F0F6FC"
                            font-size="15"
                            font-weight="700"
                            font-family="Arial, sans-serif"
                          >
                            {day.day}
                          </text>
                          '''
                      )


                      # Anonymous contribution count
                      if count > 0:

                          svg.append(
                              f'''
                              <text
                                x="{x + CELL_W - 12}"
                                y="{y + 44}"
                                text-anchor="end"
                                fill="#FFFFFF"
                                font-size="11"
                                font-weight="600"
                                font-family="Arial, sans-serif"
                              >
                                {count} contrib.
                              </text>
                              '''
                          )


                      svg.append("</g>")


              # Footer
              footer_y = HEIGHT - 28

              svg.append(
                  f'''
                  <text
                    x="{WIDTH / 2}"
                    y="{footer_y}"
                    text-anchor="middle"
                    fill="#6E7681"
                    font-size="12"
                    font-family="Arial, sans-serif"
                  >
                    @{USERNAME} • GitHub Contribution Activity
                  </text>
                  '''
              )


              svg.append("</svg>")


              return "\n".join(svg)


          # ============================================================
          # GENERATE MONTHLY CALENDARS
          # ============================================================

          results = []

          restricted_activity_seen = False


          for month_start in months:

              print(
                  "Generating "
                  + month_start.strftime(
                      "%B %Y"
                  )
              )


              (
                  counts,
                  total,
                  has_private_activity,
              ) = fetch_month(
                  month_start
              )


              if has_private_activity:
                  restricted_activity_seen = True


              key = month_start.strftime(
                  "%Y-%m"
              )


              svg_content = generate_svg(
                  month_start,
                  counts,
                  total
              )


              svg_path = (
                  ASSETS_DIR
                  / f"{key}.svg"
              )


              svg_path.write_text(
                  svg_content,
                  encoding="utf-8"
              )


              results.append(
                  {
                      "date": month_start,
                      "key": key,
                      "total": total,
                  }
              )


          # ============================================================
          # INDIVIDUAL MONTH PAGES
          # ============================================================

          for index, item in enumerate(
              results
          ):

              month_start = item["date"]
              key = item["key"]

              month_title = (
                  month_start.strftime(
                      "%B %Y"
                  )
              )


              previous_item = (
                  results[index - 1]
                  if index > 0
                  else None
              )


              next_item = (
                  results[index + 1]
                  if index < len(results) - 1
                  else None
              )


              if previous_item:

                  previous_title = (
                      previous_item["date"]
                      .strftime("%B %Y")
                  )

                  previous_link = (
                      f'<a href="./'
                      f'{previous_item["key"]}.md">'
                      f'⬅ {previous_title}'
                      f'</a>'
                  )

              else:

                  previous_link = (
                      "⬅ Previous"
                  )


              if next_item:

                  next_title = (
                      next_item["date"]
                      .strftime("%B %Y")
                  )

                  next_link = (
                      f'<a href="./'
                      f'{next_item["key"]}.md">'
                      f'{next_title} ➡'
                      f'</a>'
                  )

              else:

                  next_link = (
                      "Next ➡"
                  )


              page = f"""# 📅 {month_title} Contributions

          <p align="center">
            <img
              src="./assets/{key}.svg"
              width="100%"
              alt="{month_title} contribution calendar"
            />
          </p>

          <p align="center">
            {previous_link}
            &nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp;
            <a href="./README.md">📅 All Months</a>
            &nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp;
            {next_link}
          </p>

          <p align="center">
            <strong>
              {item["total"]} contributions during {month_title}
            </strong>
          </p>

          ---

          <p align="center">
            Automatically generated from GitHub contribution data.
          </p>
          """


              month_page_path = (
                  ACTIVITY_DIR
                  / f"{key}.md"
              )


              month_page_path.write_text(
                  page,
                  encoding="utf-8"
              )


          # ============================================================
          # ALL MONTHS INDEX
          # ============================================================

          rows = []

          reversed_results = list(
              reversed(results)
          )


          for index in range(
              0,
              len(reversed_results),
              3
          ):

              group = (
                  reversed_results[
                      index:index + 3
                  ]
              )

              cells = []


              for item in group:

                  label = (
                      item["date"]
                      .strftime("%B %Y")
                  )

                  cells.append(
                      f'''
                      <td
                        align="center"
                        width="33%"
                      >
                        <a href="./{item["key"]}.md">
                          <strong>{label}</strong>
                        </a>
                        <br/>
                        {item["total"]} contributions
                      </td>
                      '''
                  )


              while len(cells) < 3:

                  cells.append(
                      '<td width="33%"></td>'
                  )


              rows.append(
                  "<tr>"
                  + "".join(cells)
                  + "</tr>"
              )


          index_page = f"""# 📊 Monthly GitHub Contribution History

          <p align="center">
            Explore <strong>@{USERNAME}</strong>'s
            GitHub contribution activity month by month.
          </p>

          <table>
          {''.join(rows)}
          </table>

          ---

          <p align="center">
            <a href="../README.md">
              ← Back to GitHub Profile
            </a>
          </p>
          """


          (
              ACTIVITY_DIR
              / "README.md"
          ).write_text(
              index_page,
              encoding="utf-8"
          )


          # ============================================================
          # UPDATE PROFILE README
          # ============================================================

          latest = results[-1]

          latest_title = (
              latest["date"]
              .strftime("%B %Y")
          )

          latest_key = latest["key"]


          profile_section = f"""<!-- MONTHLY-CONTRIBUTIONS:START -->

          ## 📅 Monthly Contribution Activity

          <p align="center">
            <a href="./activity/{latest_key}.md">
              <img
                src="./activity/assets/{latest_key}.svg"
                width="95%"
                alt="{latest_title} GitHub Contributions"
              />
            </a>
          </p>

          <p align="center">
            <a href="./activity/{latest_key}.md">
              <strong>← Previous / Next →</strong>
            </a>

            &nbsp;&nbsp;•&nbsp;&nbsp;

            <a href="./activity/README.md">
              <strong>View All Months 📊</strong>
            </a>
          </p>

          <!-- MONTHLY-CONTRIBUTIONS:END -->"""


          readme_path = ROOT / "README.md"


          if readme_path.exists():

              readme = (
                  readme_path.read_text(
                      encoding="utf-8"
                  )
              )

          else:

              readme = (
                  f"# {USERNAME}\n"
              )


          section_pattern = re.compile(
              r"<!-- MONTHLY-CONTRIBUTIONS:START -->"
              r".*?"
              r"<!-- MONTHLY-CONTRIBUTIONS:END -->",
              re.DOTALL
          )


          if section_pattern.search(
              readme
          ):

              readme = (
                  section_pattern.sub(
                      profile_section,
                      readme
                  )
              )

          else:

              readme = (
                  readme.rstrip()
                  + "\n\n---\n\n"
                  + profile_section
                  + "\n"
              )


          readme_path.write_text(
              readme,
              encoding="utf-8"
          )


          # ============================================================
          # SAFE LOG OUTPUT
          # ============================================================

          print("")
          print(
              "✅ Monthly contribution calendar generated."
          )

          print(
              "✅ Latest month: "
              + latest_title
          )

          print(
              "✅ Generated "
              + str(len(results))
              + " monthly calendars."
          )

          print(
              "✅ README.md updated."
          )


          # We deliberately do NOT print:
          #
          # - private repository names
          # - private repository URLs
          # - private commit messages
          # - private/public contribution breakdown
          #
          # Only this privacy-safe boolean confirmation.

          if restricted_activity_seen:

              print(
                  "✅ GitHub reported anonymized "
                  "restricted contribution activity."
              )

          else:

              print(
                  "ℹ️ GitHub did not report restricted "
                  "activity in this period."
              )

          PY


      - name: Commit generated files
        shell: bash

        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- README.md activity/

          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update monthly contribution calendar"

          git push
